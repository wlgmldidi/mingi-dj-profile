<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AE 민기 | Profile Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Dodum&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 15%,#f3ddff 0 13%,transparent 32%),radial-gradient(circle at 80% 85%,#ffe5bd 0 12%,transparent 32%),#fbf9ff;color:#282338;font-family:"Gowun Dodum",sans-serif}
    main{width:min(100% - 32px,570px);padding:28px;text-align:center}.frame{position:relative;width:min(100%,390px);aspect-ratio:1;margin:0 auto;overflow:hidden;border:10px solid #fff;border-radius:36px;box-shadow:0 24px 60px rgba(66,44,110,.22);background:#eee8ff}.frame img{display:block;width:100%;height:100%;object-fit:cover}.frame:after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.72);border-radius:25px;pointer-events:none}
    .eyebrow{margin:26px 0 8px;color:#a58ac8;font:500 11px "DM Mono",monospace;letter-spacing:.17em}.name{margin:0;font:700 42px/1 "Playfair Display",serif;letter-spacing:-.05em}.handle{margin:10px 0 0;color:#706a82;font:400 13px "DM Mono",monospace}.note{margin:25px auto 0;max-width:370px;padding:13px 16px;border-radius:13px;background:rgba(255,255,255,.7);color:#676175;font-size:13px;line-height:1.65}
  </style>
</head>
<body>
  <main>
    <div class="frame">
      <img src="https://kr-cdn.spooncast.net/profiles/2026/08/13/f1783ba5-da91-4f92-91be-013c9230c880-L.jpg" alt="AE 민기 스푼 프로필 사진">
    </div>
    <p class="eyebrow">SPOON DJ · PROFILE PHOTO</p>
    <h1 class="name">AE 민기</h1>
    <p class="handle">@mingi0811</p>
    <p class="note">스푼 프로필에 공개된 이미지입니다.</p>
  </main>
</body>
</html>
